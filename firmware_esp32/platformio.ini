; ============================================================================
; Spidey-Nav - ESP32-C3 Super Mini + ILI9341 2.4" SPI TFT + NimBLE
; Environment configuration with zero-modification TFT_eSPI build flags
; ============================================================================

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32 @ ^6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Serial monitor & upload configuration for ESP32-C3 native USB CDC
monitor_dtr = 1
monitor_rts = 0
upload_port = COM5
monitor_port = COM5

; Dependencies: Lean BLE stack & High-performance display driver
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.0.8
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0.4

; Build Flags: Full override of TFT_eSPI configuration (no User_Setup.h editing required!)
build_flags =
    ; Enable USB-CDC serial output on boot
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; TFT_eSPI Configuration Flags
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; Hardware SPI Pinout mapping (Sesuai wiring fisik pengguna)
    -DTFT_MOSI=7      ; SDI / MOSI -> GPIO 7
    -DTFT_SCLK=6      ; SCK / CLK  -> GPIO 6
    -DTFT_CS=5        ; CS         -> GPIO 5
    -DTFT_DC=10       ; DC / RS    -> GPIO 10
    -DTFT_RST=3       ; RESET      -> GPIO 3
    -DTFT_BL=-1
    -DTFT_MISO=-1
    -DTOUCH_CS=-1

    ; Font Loading (Included minimal sets to conserve flash & RAM)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1

    ; SPI Bus Frequency (27MHz high-throughput clock for smooth streaming)
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
